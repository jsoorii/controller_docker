version: '3.8'

services:
  mujoco_sim:
    build: .
    container_name: ur5e_mujoco_ros2
    volumes:
      - ./my_ur5e_controller:/ros2_ws/src/my_ur5e_controller
      - ./web_dashboard:/ros2_ws/src/web_dashboard
    ports:
      - "8000-8010:7000-7010"  # Meshcat (동적 포트 범위, host 8000-8010 → container 7000-7010)
      - "8100:7100"             # Gripper viewer (MJPEG)
      - "8101:7101"             # Combined viewer (MJPEG)
    stdin_open: true
    tty: true
    privileged: true
    environment:
      - MUJOCO_GL=osmesa