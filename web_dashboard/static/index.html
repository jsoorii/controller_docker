<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heroi Docker Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body { background: #f8f9fa; color: #212529; }
    .card { background: #ffffff; border: 1px solid #dee2e6; }
    .card-header { background: #e9ecef; font-weight: 600; color: #212529; }
    #log-box {
      background: #212529;
      color: #a8ff78;
      font-family: monospace;
      font-size: 0.8rem;
      height: 420px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      padding: 12px;
      border-radius: 6px;
    }
    .badge-running  { background: #198754; }
    .badge-exited   { background: #dc3545; }
    .badge-unknown  { background: #6c757d; }
    #cmd-input { background: #ffffff; color: #212529; border-color: #ced4da; }
    #cmd-output {
      background: #212529;
      color: #ffd966;
      font-family: monospace;
      font-size: 0.8rem;
      min-height: 120px;
      max-height: 500px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 로그인 오버레이 */
    #login-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    #login-box {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    #login-box h5 { margin-bottom: 1.2rem; font-weight: 700; }
    #login-error { color: #dc3545; font-size: 0.85rem; min-height: 1.2em; }
  </style>
</head>
<body>

<!-- 로그인 오버레이 -->
<div id="login-overlay">
  <div id="login-box">
    <h5>🤖 Heroi Dashboard 로그인</h5>
    <div class="mb-3">
      <label class="form-label small">아이디</label>
      <input id="login-user" type="text" class="form-control" autocomplete="username" />
    </div>
    <div class="mb-3">
      <label class="form-label small">비밀번호</label>
      <input id="login-pass" type="password" class="form-control" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') doLogin()" />
    </div>
    <div id="login-error"></div>
    <button class="btn btn-primary w-100 mt-2" onclick="doLogin()">로그인</button>
  </div>
</div>

<div class="container py-4">
  <h3 class="mb-4">🤖 Heroi Docker Dashboard</h3>

  <!-- 상태 카드 -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      컨테이너 상태
      <button class="btn btn-sm btn-outline-secondary" onclick="fetchStatus()">새로고침</button>
    </div>
    <div class="card-body d-flex align-items-center gap-3">
      <span id="status-badge" class="badge badge-unknown fs-6 px-3 py-2">확인 중…</span>
      <span id="status-detail" class="text-muted small"></span>
    </div>
  </div>

  <!-- 제어 버튼 -->
  <div class="card mb-3">
    <div class="card-header">도커 제어</div>
    <div class="card-body d-flex gap-2 flex-wrap">
      <button class="btn btn-success" onclick="action('start')">▶ 시작</button>
      <button class="btn btn-danger"  onclick="action('stop')">■ 중지</button>
      <button class="btn btn-warning" onclick="action('restart')">↺ 재시작</button>
    </div>
  </div>

  <!-- 명령 실행 -->
  <div class="card mb-3">
    <div class="card-header">컨테이너 내 명령 실행</div>
    <div class="card-body">
      <div class="input-group mb-2">
        <input id="cmd-input" type="text" class="form-control"
               placeholder="예: ros2 topic list"
               onkeydown="if(event.key==='Enter') execCmd()" />
        <button class="btn btn-primary" onclick="execCmd()">실행</button>
        <button class="btn btn-secondary" onclick="execBg()" title="백그라운드 실행 (결과 없음, /tmp/bg.log에 저장)">BG</button>
      </div>
      <div class="d-flex justify-content-end mb-1">
        <button class="btn btn-sm btn-outline-secondary" onclick="copyCmdOutput()">복사</button>
      </div>
      <div id="cmd-output">결과가 여기 표시됩니다.</div>
    </div>
  </div>

  <!-- 조인트 제어 -->
  <div class="card mb-3">
    <div class="card-header">조인트 제어 (rad)</div>
    <div class="card-body">
      <div id="joint-inputs"></div>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-success" onclick="sendJoint()">전송</button>
        <button class="btn btn-outline-secondary" onclick="resetJoints()">초기화</button>
      </div>
      <div id="joint-status" class="text-muted small mt-2"></div>
    </div>
  </div>

  <!-- 스트리밍 명령 -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      스트리밍 명령
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-primary" onclick="startStream()">시작</button>
        <button class="btn btn-sm btn-danger" onclick="stopStream()">중지</button>
        <button class="btn btn-sm btn-outline-danger" onclick="clearStream()">지우기</button>
      </div>
    </div>
    <div class="card-body">
      <div class="input-group mb-2">
        <input id="stream-input" type="text" class="form-control"
               placeholder="예: ros2 topic echo /ur5e/state/joint"
               onkeydown="if(event.key==='Enter') startStream()" />
      </div>
      <div id="stream-output" style="
        background:#212529; color:#a8ff78; font-family:monospace;
        font-size:0.8rem; min-height:120px; max-height:400px;
        overflow-y:auto; padding:10px; border-radius:6px;
        white-space:pre-wrap; word-break:break-all;">
      </div>
    </div>
  </div>

  <!-- 로봇 3D 뷰어 -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      로봇 3D 뷰어
      <div class="d-flex gap-2 align-items-center">
        <span id="view3d-status" class="text-muted small"></span>
        <button class="btn btn-sm btn-outline-secondary" onclick="fetch3D()">🔄 렌더링</button>
      </div>
    </div>
    <div class="card-body text-center p-2">
      <div id="view3d-hint" class="text-muted small mb-2">버튼을 눌러 3D 뷰를 로드합니다.</div>
      <div id="view3d-wrap" style="display:none; position:relative; display:inline-block; cursor:grab; user-select:none;">
        <img id="view3d-img" src="" alt="" draggable="false"
             style="display:block; border-radius:8px; max-width:360px; width:100%;" />
        <div style="position:absolute; bottom:6px; left:0; right:0; text-align:center;
                    font-size:0.7rem; color:rgba(255,255,255,0.7); pointer-events:none;">
          ← 드래그해서 회전 →
        </div>
      </div>
    </div>
  </div>

  <!-- 노트 -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      노트
      <button class="btn btn-sm btn-outline-danger" onclick="clearNote()">지우기</button>
    </div>
    <div class="card-body p-2">
      <textarea id="note-box" class="form-control" rows="5"
                placeholder="여기에 메모를 입력하세요. 새로고침해도 유지됩니다."
                oninput="saveNote()"
                style="font-family:monospace; font-size:0.85rem; resize:vertical;"></textarea>
    </div>
  </div>

  <!-- 실시간 로그 -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      컨트롤러 로그 (/tmp/bg.log)
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" onclick="toggleLogPanel()">
          <span id="log-panel-label">▼ 열기</span>
        </button>
        <button class="btn btn-sm btn-outline-danger" onclick="clearLog()" id="log-clear-btn" style="display:none;">지우기</button>
      </div>
    </div>
    <div id="log-panel" style="display:none;">
      <div class="card-body p-2">
        <div id="log-box"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ── 인증 ─────────────────────────────────────────────────────────────────
  let authHeader = sessionStorage.getItem('auth') || '';

  async function doLogin() {
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    const errEl = document.getElementById('login-error');
    if (!user || !pass) { errEl.textContent = '아이디와 비밀번호를 입력하세요.'; return; }

    const cand = 'Basic ' + btoa(user + ':' + pass);
    const res = await fetch('/api/status', { headers: { 'Authorization': cand } });
    if (res.ok) {
      authHeader = cand;
      sessionStorage.setItem('auth', authHeader);
      document.getElementById('login-overlay').style.display = 'none';
      init();
    } else {
      errEl.textContent = '아이디 또는 비밀번호가 틀렸습니다.';
      document.getElementById('login-pass').value = '';
    }
  }

  async function apiFetch(url, options = {}) {
    const headers = { 'Authorization': authHeader, ...(options.headers || {}) };
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) {
      sessionStorage.removeItem('auth');
      authHeader = '';
      document.getElementById('login-overlay').style.display = 'flex';
    }
    return res;
  }

  // ── 상태 ──────────────────────────────────────────────────────────────────
  async function fetchStatus() {
    const res = await apiFetch('/api/status');
    if (!res.ok) return;
    const d = await res.json();
    const badge = document.getElementById('status-badge');
    const detail = document.getElementById('status-detail');
    badge.textContent = d.status;
    badge.className = 'badge fs-6 px-3 py-2 ' +
      (d.status === 'running' ? 'badge-running' :
       d.status === 'exited'  ? 'badge-exited' : 'badge-unknown');
    detail.textContent = d.id ? `${d.name}  (${d.id})  ${d.image}` : '';
  }

  // ── 제어 ──────────────────────────────────────────────────────────────────
  async function action(cmd) {
    const res = await apiFetch(`/api/${cmd}`, { method: 'POST' });
    if (!res.ok && res.status !== 401) {
      const d = await res.json();
      alert(d.detail || JSON.stringify(d));
      return;
    }
    const d = await res.json();
    alert(d.message || d.detail || JSON.stringify(d));
    fetchStatus();
  }

  // ── 명령 실행 ─────────────────────────────────────────────────────────────
  async function execCmd() {
    const cmd = document.getElementById('cmd-input').value.trim();
    if (!cmd) return;
    document.getElementById('cmd-output').textContent = '실행 중…';
    const res = await apiFetch('/api/exec', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd }),
    });
    if (!res.ok && res.status !== 401) return;
    const d = await res.json();
    document.getElementById('cmd-output').textContent =
      `[exit ${d.exit_code}]\n${d.output}`;
  }

  // ── 조인트 제어 ───────────────────────────────────────────────────────────
  const JOINTS = [
    { name: "shoulder_pan",  min: -6.28, max: 6.28 },
    { name: "shoulder_lift", min: -6.28, max: 6.28 },
    { name: "elbow",         min: -3.14, max: 3.14 },
    { name: "wrist_1",       min: -6.28, max: 6.28 },
    { name: "wrist_2",       min: -6.28, max: 6.28 },
    { name: "wrist_3",       min: -6.28, max: 6.28 },
  ];

  (function buildJointUI() {
    const container = document.getElementById('joint-inputs');
    JOINTS.forEach((j, i) => {
      container.innerHTML += `
        <div class="row align-items-center mb-2">
          <div class="col-3 small fw-bold">${j.name}</div>
          <div class="col-6">
            <input type="range" class="form-range" id="joint-slider-${i}"
              min="${j.min}" max="${j.max}" step="0.01" value="0"
              oninput="document.getElementById('joint-val-${i}').value=parseFloat(this.value).toFixed(3)">
          </div>
          <div class="col-3">
            <input type="number" class="form-control form-control-sm" id="joint-val-${i}"
              min="${j.min}" max="${j.max}" step="0.01" value="0.000"
              oninput="document.getElementById('joint-slider-${i}').value=this.value">
          </div>
        </div>`;
    });
  })();

  function getJointValues() {
    return JOINTS.map((_, i) => parseFloat(document.getElementById(`joint-val-${i}`).value) || 0);
  }

  function resetJoints() {
    JOINTS.forEach((_, i) => {
      document.getElementById(`joint-slider-${i}`).value = 0;
      document.getElementById(`joint-val-${i}`).value = '0.000';
    });
  }

  async function sendJoint() {
    const joints = getJointValues();
    const status = document.getElementById('joint-status');
    status.textContent = '전송 중…';
    const res = await apiFetch('/api/pub/joint', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ joints }),
    });
    if (!res.ok && res.status !== 401) { status.textContent = '전송 실패'; return; }
    const d = await res.json();
    status.textContent = d.ok ? `전송 완료: [${joints.map(v => v.toFixed(3)).join(', ')}]` : `오류: ${d.output}`;
  }

  // ── 명령 출력 복사 ────────────────────────────────────────────────────────
  async function copyCmdOutput() {
    const text = document.getElementById('cmd-output').textContent;
    await navigator.clipboard.writeText(text);
    const btn = event.target;
    btn.textContent = '복사됨!';
    setTimeout(() => btn.textContent = '복사', 1500);
  }

  // ── 스트리밍 명령 ─────────────────────────────────────────────────────────
  let streamController = null;

  async function startStream() {
    const cmd = document.getElementById('stream-input').value.trim();
    if (!cmd) return;
    stopStream();
    streamController = new AbortController();
    const box = document.getElementById('stream-output');
    box.textContent += `\n▶ ${cmd}\n`;
    try {
      const res = await apiFetch('/api/exec_stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cmd }),
        signal: streamController.signal,
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        box.textContent += decoder.decode(value, { stream: true });
        box.scrollTop = box.scrollHeight;
      }
    } catch (e) {
      if (e.name !== 'AbortError') box.textContent += '\n[연결 끊김]\n';
    }
    box.textContent += '■ 종료\n';
    box.scrollTop = box.scrollHeight;
  }

  function stopStream() {
    if (streamController) { streamController.abort(); streamController = null; }
  }

  function clearStream() {
    stopStream();
    document.getElementById('stream-output').textContent = '';
  }

  // ── 백그라운드 실행 ───────────────────────────────────────────────────────
  async function execBg() {
    const cmd = document.getElementById('cmd-input').value.trim();
    if (!cmd) return;
    document.getElementById('cmd-output').textContent = '백그라운드 실행 중…';
    const res = await apiFetch('/api/exec_bg', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd }),
    });
    if (!res.ok && res.status !== 401) return;
    const d = await res.json();
    document.getElementById('cmd-output').textContent =
      d.message + '\n로그: ' + d.log;
  }

  // ── 실시간 로그 ───────────────────────────────────────────────────────────
  let logController = null;
  let logRunning = false;

  async function startLog() {
    if (logController) logController.abort();
    logController = new AbortController();
    const box = document.getElementById('log-box');
    try {
      const res = await fetch('/api/logs?lines=200', {
        headers: { 'Authorization': authHeader },
        signal: logController.signal,
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        box.textContent += decoder.decode(value, { stream: true });
        box.scrollTop = box.scrollHeight;
      }
    } catch (e) {
      if (e.name !== 'AbortError') {
        box.textContent += '\n[연결 끊김]\n';
      }
    }
    logRunning = false;
    document.getElementById('log-toggle-label').textContent = '시작';
  }

  function stopLog() {
    if (logController) { logController.abort(); logController = null; }
    logRunning = false;
    document.getElementById('log-toggle-label').textContent = '시작';
  }

  let logPanelOpen = false;

  function toggleLogPanel() {
    logPanelOpen = !logPanelOpen;
    const panel = document.getElementById('log-panel');
    const label = document.getElementById('log-panel-label');
    const clearBtn = document.getElementById('log-clear-btn');
    if (logPanelOpen) {
      panel.style.display = 'block';
      label.textContent = '▲ 닫기';
      clearBtn.style.display = 'inline-block';
      logRunning = true;
      startLog();
    } else {
      panel.style.display = 'none';
      label.textContent = '▼ 열기';
      clearBtn.style.display = 'none';
      stopLog();
      document.getElementById('log-box').textContent = '';
    }
  }

  function clearLog() {
    document.getElementById('log-box').textContent = '';
  }

  // ── 로봇 3D 터닝테이블 ────────────────────────────────────────────────────
  let _3d = { frames: [], nAz: 24, nEl: 5, azIdx: 0, elIdx: 2, drag: null };

  async function fetch3D() {
    const status = document.getElementById('view3d-status');
    const wrap   = document.getElementById('view3d-wrap');
    const hint   = document.getElementById('view3d-hint');
    status.textContent = '렌더링 중…';
    wrap.style.display = 'none';
    const res = await apiFetch('/api/robot_3d');
    if (!res.ok) { status.textContent = '렌더링 실패'; return; }
    const d = await res.json();
    _3d.frames = d.frames;
    _3d.nAz    = d.n_az;
    _3d.nEl    = d.n_el;
    _3d.azIdx  = 0;
    _3d.elIdx  = Math.floor(d.n_el / 2);   // 중간 앙각에서 시작
    hint.style.display = 'none';
    wrap.style.display = 'inline-block';
    show3DFrame();
    status.textContent = `업데이트: ${new Date().toLocaleTimeString()}`;
  }

  function show3DFrame() {
    const idx = _3d.elIdx * _3d.nAz + _3d.azIdx;
    document.getElementById('view3d-img').src = 'data:image/jpeg;base64,' + _3d.frames[idx];
  }

  (function setup3DDrag() {
    function onStart(x, y) {
      _3d.drag = { startX: x, startY: y, startAz: _3d.azIdx, startEl: _3d.elIdx };
    }
    function onMove(x, y) {
      if (!_3d.drag || !_3d.frames.length) return;
      const dAz = Math.round((x - _3d.drag.startX) / 12);
      const dEl = Math.round((y - _3d.drag.startY) / 20);
      _3d.azIdx = ((_3d.drag.startAz - dAz) % _3d.nAz + _3d.nAz) % _3d.nAz;
      _3d.elIdx = Math.max(0, Math.min(_3d.nEl - 1, _3d.drag.startEl + dEl));
      show3DFrame();
    }
    function onEnd() { _3d.drag = null; }

    const el = document.getElementById('view3d-wrap');
    el.addEventListener('mousedown',  e => { onStart(e.clientX, e.clientY); el.style.cursor = 'grabbing'; });
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    window.addEventListener('mouseup',   () => { onEnd(); el.style.cursor = 'grab'; });
    el.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    el.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    el.addEventListener('touchend',   onEnd);
  })();

  // ── 노트 (localStorage) ───────────────────────────────────────────────────
  function saveNote() {
    localStorage.setItem('heroi_note', document.getElementById('note-box').value);
  }
  function clearNote() {
    document.getElementById('note-box').value = '';
    localStorage.removeItem('heroi_note');
  }

  // ── 초기화 ────────────────────────────────────────────────────────────────
  function init() {
    fetchStatus();
    setInterval(fetchStatus, 5000);
  }

  // 노트 복원
  const savedNote = localStorage.getItem('heroi_note');
  if (savedNote) document.getElementById('note-box').value = savedNote;

  // sessionStorage에 인증 정보가 있으면 바로 대시보드 표시
  if (authHeader) {
    document.getElementById('login-overlay').style.display = 'none';
    init();
  } else {
    // 포커스를 아이디 입력창으로
    window.addEventListener('load', () => document.getElementById('login-user').focus());
  }
</script>
</body>
</html>
